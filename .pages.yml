# Pages CMS — https://pagescms.org
#
# Describes the site's content files as editing forms. Sign in at
# app.pagescms.org with GitHub, pick this repository, and everything below
# appears as a form. Saving writes to the repo and the site redeploys.

media:
  - name: placements
    label: Placement images
    input: public/placements
    output: /placements
    extensions: [jpg, jpeg, png, webp]
  - name: diary
    label: Visual Diary images
    input: public/visual-diary
    output: /visual-diary
    extensions: [jpg, jpeg, png, webp]
  - name: general
    label: Other images
    input: public
    output: /
    extensions: [jpg, jpeg, png, webp, svg]

content:
  # ------------------------------------------------------------------
  - name: site
    label: Site
    path: content/site.json
    type: file
    icon: settings
    fields:
      - name: siteConfig
        label: Site details
        type: object
        fields:
          - { name: name, label: Site name, type: string }
          - { name: tagline, label: Tagline, type: string }
          - { name: logo, label: Short mark, type: string, description: Used where the full name will not fit }
          - { name: metaTitle, label: Browser tab title, type: string }
          - name: metaDescription
            label: Search engine description
            type: text
            description: One or two sentences. Shown in Google results.
      - name: navigation
        label: Menu
        type: object
        list: true
        description: An address starting with # scrolls to a section of the home page. One starting with / opens a page. The first three sit centre, the rest right.
        fields:
          - { name: name, label: Label, type: string }
          - { name: href, label: Address, type: string }
      - name: footer
        label: Footer
        type: object
        fields:
          - { name: copyright, label: Copyright line, type: string }
          - { name: company, label: Registered company name, type: string }
          - { name: companyNumber, label: Company number line, type: string }
          - name: socials
            label: Links
            type: object
            list: true
            fields:
              - { name: name, label: Label, type: string }
              - { name: url, label: Address, type: string }

  # ------------------------------------------------------------------
  - name: home
    label: Home
    path: content/home.json
    type: file
    icon: home
    fields:
      - name: home
        label: Opening screen
        type: object
        fields:
          - { name: headline, label: Headline, type: text }
          - { name: lede, label: Sentence beneath, type: text }
          - { name: testimonialsLabel, label: Testimonials heading, type: string }
          - { name: ctaLabel, label: Call to action heading, type: string }
          - { name: cta, label: Call to action, type: string }
          - { name: ctaLink, label: Call to action address, type: string }
      - name: intro
        label: Opening flicker
        type: object
        description: The full-screen animation before the site. Every mark is paired with every conjunction.
        fields:
          - { name: marks, label: Marks, type: string, list: true }
          - { name: ands, label: Ways of writing "and", type: string, list: true }
          - { name: final, label: Always first and last, type: string }
          - { name: hint, label: Hint beneath, type: string, description: Leave empty to show nothing }
      - name: subscribe
        label: Subscribe screen
        type: object
        fields:
          - { name: eyebrow, label: Small line above, type: string }
          - { name: headline, label: Headline, type: text }
          - { name: lede, label: Sentence beneath, type: text }
          - { name: cta, label: Call to action, type: string }
          - { name: ctaLink, label: Substack address, type: string }
          - name: feeds
            label: Feeds
            type: object
            list: true
            description: Shown as a row of tabs, one feed at a time. The first is showing when the screen appears.
            fields:
              - { name: label, label: Name, type: string, description: e.g. Latest or Most read }
              - { name: embedId, label: Supascribe embed id, type: string }
          - { name: feedScript, label: Supascribe script address, type: string }
      - name: testimonials
        label: Testimonials
        type: object
        list: true
        description: Shown after the placements, one at a time, sliding across as the page scrolls. Three reads best.
        fields:
          - { name: text, label: Quote, type: text }
          - { name: author, label: Who said it, type: string }

  # ------------------------------------------------------------------
  - name: about
    label: About and Founder
    path: content/about.json
    type: file
    icon: user
    fields:
      - { name: title, label: About heading, type: string }
      - { name: intro, label: First paragraph, type: text }
      - { name: approach, label: Second paragraph, type: text }
      - { name: closing, label: Third paragraph, type: text }
      - { name: founderTitle, label: Founder heading, type: string }
      - { name: founderName, label: Founder name, type: string, description: Signs the quote. Not shown on the founder screen. }
      - { name: founderBio, label: Biography, type: text }
      - { name: founderQuote, label: Quote, type: text, description: Shown on its own screen, in colour. }
      - { name: founderClosure, label: Closing paragraph, type: text }
      - { name: ctaLabel, label: Call to action heading, type: string }
      - { name: cta, label: Call to action, type: string }
      - { name: ctaLink, label: Call to action address, type: string }

  # ------------------------------------------------------------------
  - name: services
    label: Services
    path: content/services.json
    type: file
    icon: list
    fields:
      - { name: title, label: Heading, type: string }
      - name: services
        label: Groups
        type: object
        list: true
        fields:
          - { name: title, label: Group name, type: string, description: Shown on its own until hovered or clicked. }
          - { name: description, label: Description, type: text, description: Optional. Drops down with the points. Leave empty to show none. }
          - { name: items, label: Points, type: string, list: true }
      - { name: ctaLabel, label: Call to action heading, type: string }
      - { name: cta, label: Call to action, type: string }
      - { name: ctaLink, label: Call to action address, type: string }

  # ------------------------------------------------------------------
  - name: placements
    label: Placements
    path: content/placements.json
    type: file
    icon: image
    fields:
      - name: page
        label: Page wording
        type: object
        fields:
          - { name: metaTitle, label: Browser tab title, type: string }
          - { name: title, label: Heading, type: string }
          - { name: intro, label: Sentence beneath, type: text }
          - { name: filterLabel, label: Filter label, type: string }
          - { name: gridLabel, label: Grid label, type: string }
          - name: previewCount
            label: Works on the home page
            type: number
            description: How many sit in the home page row. Four are in view at a time.
          - { name: previewCta, label: Link to the full page, type: string }
          - { name: previewCtaLink, label: Address of the full page, type: string }
      - name: categories
        label: Filters
        type: object
        list: true
        description: A filter only appears if there is work in it.
        fields:
          - { name: value, label: Value, type: string }
          - { name: label, label: Label, type: string }
      - name: works
        label: Works
        type: object
        list: true
        fields:
          - name: image
            label: Image
            type: image
            options: { media: placements }
          - { name: artist, label: Artist, type: string }
          - { name: title, label: Title, type: string }
          - { name: year, label: Year, type: number }
          - { name: medium, label: Medium, type: string, description: Held on record but not shown on the site. }
          - name: category
            label: Category
            type: select
            options:
              values: [painting, sculpture, works-on-paper, textile, mixed-media]

  # ------------------------------------------------------------------
  - name: visual-diary
    label: Visual Diary
    path: content/visual-diary.json
    type: file
    icon: camera
    fields:
      - name: page
        label: Page wording
        type: object
        fields:
          - { name: metaTitle, label: Browser tab title, type: string }
          - { name: title, label: Heading, type: string }
          - { name: intro, label: Sentence beneath, type: text }
          - { name: feedLabel, label: Feed label, type: string }
          - name: seed
            label: Arrangement
            type: number
            description: Any number. Change it to shuffle the images into a different scatter.
          - { name: shuffle, label: Mix up the order, type: boolean }
      - name: entries
        label: Images
        type: object
        list: true
        fields:
          - name: image
            label: Image
            type: image
            options: { media: diary }
          - { name: alt, label: Description, type: string, description: For screen readers. Not shown on the page. }
          - { name: caption, label: Caption, type: string, description: Optional. Shown beneath the image. }
          - { name: link, label: Link, type: string, description: Optional. Makes the image clickable. }
          - name: size
            label: Size
            type: select
            options:
              values: [small, medium, large]

  # ------------------------------------------------------------------
  - name: notes
    label: Notes
    path: content/notes.json
    type: file
    icon: file-text
    fields:
      - name: page
        label: Page wording
        type: object
        fields:
          - { name: metaTitle, label: Browser tab title, type: string }
          - { name: title, label: Heading, type: string }
          - { name: intro, label: Sentence beneath, type: text }
          - { name: filterLabel, label: Filter label, type: string }
          - { name: allLabel, label: "\"All\" filter label", type: string }
          - { name: categories, label: Categories, type: string, list: true }
          - { name: archiveCta, label: Link to the archive, type: string }
          - { name: archiveUrl, label: Substack address, type: string }
      - name: posts
        label: Posts
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: slug, label: Slug, type: string, description: A short name with dashes. Must be different from every other post. }
          - { name: excerpt, label: Summary, type: text }
          - { name: date, label: Date, type: string, description: Written as you want it shown, e.g. 31 August 2026 }
          - { name: category, label: Category, type: string }
          - { name: author, label: Written by, type: string }
          - { name: url, label: Substack link, type: string, description: Optional. With it, the title becomes a link. }

  # ------------------------------------------------------------------
  - name: not-found
    label: Page not found
    path: content/not-found.json
    type: file
    icon: help-circle
    fields:
      - name: page
        label: Page wording
        type: object
        description: Shown when someone follows an address the site does not have.
        fields:
          - { name: code, label: Small line above, type: string }
          - { name: title, label: Heading, type: string }
          - { name: lede, label: Sentence beneath, type: text }
          - { name: homeLabel, label: Link home, type: string }
      - name: song
        label: Song
        type: object
        fields:
          - name: lines
            label: Lines
            type: object
            list: true
            fields:
              - { name: text, label: Line, type: string }
              - name: highlight
                label: Words that flicker
                type: string
                description: Optional. Words within the line that flicker through the marks, as the opening screen does. Must appear in the line exactly.
          - { name: credit, label: Credit, type: text }

  # ------------------------------------------------------------------
  - name: contact
    label: Contact
    path: content/contact.json
    type: file
    icon: mail
    fields:
      - { name: title, label: Heading, type: string }
      - { name: description, label: Sentence beneath, type: text }
      - { name: detailsLabel, label: Details heading, type: string }
      - { name: email, label: Email, type: string }
      - { name: address, label: Where you are, type: string }
      - { name: formLabel, label: Form heading, type: string }
      - name: form
        label: Form wording
        type: object
        fields:
          - { name: nameLabel, label: Name label, type: string }
          - { name: namePlaceholder, label: Name placeholder, type: string }
          - { name: emailLabel, label: Email label, type: string }
          - { name: emailPlaceholder, label: Email placeholder, type: string }
          - { name: messageLabel, label: Message label, type: string }
          - { name: messagePlaceholder, label: Message placeholder, type: string }
          - { name: submit, label: Button, type: string }
          - { name: sending, label: Button while sending, type: string }
          - { name: success, label: Thank you message, type: string }
          - { name: error, label: Message if sending fails, type: string }
